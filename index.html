
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIZXENN | Code Viewer</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 20px;
  background: #101116;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 850px;
  margin: 40px auto;
}
h1 {
  color: #fff;
  letter-spacing: 3px;
}
p {
  color: #999;
}
.code {
  background: #191b23;
  border: 1px solid #30323d;
  border-radius: 10px;
  padding: 18px;
  overflow: auto;
  color: #b8d7ff;
  white-space: pre;
  font: 13px monospace;
  user-select: none;
  -webkit-user-select: none;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.status {
  color: #55d98b;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>RIZXENN</h1>
    <span class="status">● ONLINE</span>
  </div>
  <p>Official Script Code Viewer</p>
  <div class="code" id="code">Loading script...</div>
</div>

<script>
const url = "script.lua";

fetch(url)
  .then(response => {
    if (!response.ok) throw new Error("Script not found");
    return response.text();
  })
  .then(data => {
    document.getElementById("code").textContent = data;
  })
  .catch(() => {
    document.getElementById("code").textContent =
      "Unable to load script.";
  });

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("copy", e => e.preventDefault());
</script>
</body>
</html>
